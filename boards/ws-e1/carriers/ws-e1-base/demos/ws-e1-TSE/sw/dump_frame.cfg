# dump_frame.cfg — G9 单帧捕获 dump（OpenOCD）
# 前置：ftdi_ti.cfg + debug_load_ti.cfg；协议见 rtl/ws_e1_tse.v G9 声明块
#   0x2B0 写 bit0 = arm 脉冲；读 = {18'h0,done(bit13),arm(bit12),ptr[11:0]}
#   0x2B4 = 拍[31:0]；0x2B8 = 拍[39:32]，读后指针步进（lo→hi 成对读遍历）
# 8 行 × 480 组 = 3840 拍 → mem2array 7680 词（lo,hi 交替）

proc rd {a} { mem2array _v 32 $a 1; return $_v(0) }
proc h {v} { return [format 0x%08X $v] }

# arm（单拍脉冲；捕获的是下一帧的前 8 行）
mww 0xF81002B0 0x00000001
sleep 400

# 轮询 done（bit13）
set ok 0
for {set i 0} {$i < 20} {incr i} {
    set st [rd 0xF81002B0]
    if {($st >> 13) & 1} { set ok 1; break }
    sleep 100
}
if {!$ok} {
    echo "=== CAPTURE TIMEOUT: status = [h $st] ==="
    shutdown
}

echo "=== CAPTURED: status = [h $st], beats=3840 ==="

# 批量读出：7680 词 = lo,hi 交替
mem2array cap 32 0xF81002B4 7680

# 写文件（jimtcl 文件 IO）
set f [open D:/Projs/ws-e1-TSE/work_pt/frame_dump.hex w]
for {set i 0} {$i < 7680} {incr i} {
    puts $f [format %08X $cap($i)]
}
close $f
echo "=== DUMPED -> work_pt/frame_dump.hex ==="
shutdown
