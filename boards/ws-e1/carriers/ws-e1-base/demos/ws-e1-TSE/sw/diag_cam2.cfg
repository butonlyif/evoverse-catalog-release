# sw/diag_cam2.cfg —— P1/G8 诊断：锁定位直通 vs 同步链 vs 地址别名
# 只读诊断（固件已在 RAM，soft reset 后读，不重复加载）
#   0x24C 'h093 magic {22'h0C0DEBA, pat_dbg_i} —— 读路径深度 sanity（G7 已验证）
#   0x254 'h095 {31'h0, pll_rgmii_locked}      —— 锁定位直通（无同步链）
#   0x258 'h096 旧 dt 槽（现在未映射，读回上一次 prdata —— 探测 stale 行为）
#   0x264 'h099 旧 status 槽（同上）
#   0x270 'h09C cam_dt_cnt
#   0x280 'h0A0 {LINESTATE,ESC}
#   0x290 'h0A4 {SOTSYNC,SOT}
#   0x2A0 'h0A8 cam_status
#   0x2A4 'h0A9 未映射（对照 stale）
if { ![info exists elf_file] } {
    echo "Error: elf_file not set."
    shutdown
}
mem2array m93 32 0xF810024C 1
mem2array lk  32 0xF8100254 1
mem2array o96 32 0xF8100258 1
mem2array o99 32 0xF8100264 1
mem2array dt  32 0xF8100270 1
mem2array le  32 0xF8100280 1
mem2array ss  32 0xF8100290 1
mem2array st  32 0xF81002A0 1
mem2array un  32 0xF81002A4 1
echo "MAGIC93=0x[format %08x $m93(0)]  (期望 0x0C0DEBAXX)"
echo "RGMII_LOCKED_RAW=0x[format %08x $lk(0)]  (直通位，bit0)"
echo "OLD96=0x[format %08x $o96(0)] OLD99=0x[format %08x $o99(0)]"
echo "DT=0x[format %08x $dt(0)] LS_ESC=0x[format %08x $le(0)] SOTSYNC_SOT=0x[format %08x $ss(0)]"
echo "STATUS=0x[format %08x $st(0)] UNMAPPED_A9=0x[format %08x $un(0)]"
resume 0xF9000000
echo "Firmware started."
