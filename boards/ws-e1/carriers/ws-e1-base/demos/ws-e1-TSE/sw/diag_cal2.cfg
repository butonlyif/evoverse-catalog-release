# sw/diag_cal2.cfg —— 恢复 cal 标定改写的寄存器基线 + 补齐 sweep + 相机探针（2026-11-06）
# 背景：diag_cal.cfg 在 0x220 读回处因 jimtcl 反斜杠续行问题中断，
#       0x20C-0x230 已被指纹值改写且未恢复。本 cfg 用 PHASE0 实测基线硬编码恢复。
# 基线来源（diag_cal.cfg PHASE0，tseDemo 固件配置）：
#   0x20c=0x000c0000 0x210=0xffffffff 0x214=0x0000ffff 0x218=0x5e0060c8 0x21c=0x0000eae8
#   0x220=0x000005b2 0x224=0x0a000008 0x228=0x0a000003 0x22c=0x27150521 0x230=0x000005b2
# 用法（cwd = embedded_sw\sapphire）：
#   openocd -f sw/bsp/openocd/ftdi_ti.cfg -f sw/bsp/openocd/debug_load_ti.cfg ^
#           -c "set elf_file <绝对路径>/tseDemo.elf" -f sw/diag_cal2.cfg -c shutdown

if { ![info exists elf_file] } {
    echo "Error: elf_file not set."
    shutdown
}

proc rd {a} {
    mem2array _v 32 $a 1
    return $_v(0)
}
proc h {v} { return [format 0x%08x $v] }
proc off {a} { return [format 0x%03x [expr {$a - 0xF8100000}]] }

echo "=== PHASE1 恢复基线 ==="
array set org {}
set org(0xF810020C) 0x000c0000
set org(0xF8100210) 0xffffffff
set org(0xF8100214) 0x0000ffff
set org(0xF8100218) 0x5e0060c8
set org(0xF810021C) 0x0000eae8
set org(0xF8100220) 0x000005b2
set org(0xF8100224) 0x0a000008
set org(0xF8100228) 0x0a000003
set org(0xF810022C) 0x27150521
set org(0xF8100230) 0x000005b2
set nfail 0
foreach a {0xF810020C 0xF8100210 0xF8100214 0xF8100218 0xF810021C 0xF8100220 0xF8100224 0xF8100228 0xF810022C 0xF8100230} {
    mww $a $org($a)
    set r [rd $a]
    if {$r == $org($a)} { set ok PASS } else { set ok FAIL; incr nfail }
    echo "RST [off $a] exp=[h $org($a)] got=[h $r] $ok"
}
echo "RESTORE: fail=$nfail"

echo "=== PHASE2 全 sweep 双读（稳定性） ==="
set sweep {}
foreach w {0x080 0x081 0x082 0x083 0x084 0x085 0x086 0x087 0x088 0x089 0x08a 0x08b 0x08c 0x090 0x092 0x093 0x094 0x095 0x09C 0x0A0 0x0A4 0x0A8 0x0A9} {
    lappend sweep [expr {0xF8100000 + ($w * 4)}]
}
foreach a $sweep {
    set r1 [rd $a]
    set r2 [rd $a]
    echo "S [off $a] = [h $r1] / [h $r2]"
}

echo "=== PHASE3 相机探针 T0/T1（1s）+ M48/M4C ==="
mem2array st1 32 0xF81002A0 1
mem2array dt1 32 0xF8100270 1
mem2array le1 32 0xF8100280 1
mem2array ss1 32 0xF8100290 1
sleep 1000
mem2array st2 32 0xF81002A0 1
mem2array dt2 32 0xF8100270 1
mem2array le2 32 0xF8100280 1
mem2array ss2 32 0xF8100290 1
echo "T0: status=[h $st1(0)] dt=[h $dt1(0)] ls_esc=[h $le1(0)] sotsync_sot=[h $ss1(0)]"
echo "T1: status=[h $st2(0)] dt=[h $dt2(0)] ls_esc=[h $le2(0)] sotsync_sot=[h $ss2(0)]"
echo "DT_DELTA_PER_S=[expr {$dt2(0) - $dt1(0)}]"
echo "M48=[h [rd 0xF8100248]]  (tx_full + free_cnt)"
echo "M4C=[h [rd 0xF810024C]]  (期望 0x037AE8xx，pat_dbg_i=低10位；22'h0C0DEBA 截断为 0xDEBA)"

load_image $elf_file
resume 0xF9000000
echo "Firmware started."
