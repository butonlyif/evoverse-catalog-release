# diag_g8c.cfg — halt 态轮询读探针（vexriscv mem2array 仅支持 halt 态）
proc rd {a} { mem2array _v 32 $a 1; return $_v(0) }
proc h {v} { return [format 0x%08X $v] }

load_image D:/Projs/ws-e1-TSE/embedded_sw/sapphire/software/standalone/tseDemo/build/tseDemo.elf 0xF9000000 bin
resume 0xF9000000
sleep 2000

foreach pass {1 2 3 4} {
    halt 10000
    echo "=== PASS $pass ==="
    echo "dt(0x270)     = [h [rd 0xF8100270]]"
    echo "ls_esc(0x280) = [h [rd 0xF8100280]]"
    echo "sot(0x290)    = [h [rd 0xF8100290]]"
    echo "status(0x2A0) = [h [rd 0xF81002A0]]"
    echo "lane(0x2AC)   = [h [rd 0xF81002AC]]  ([7:4]=STOPSTATE_LAN3..0 [3:0]=seen"
    resume
    sleep 1000
}
echo "=== DONE ==="
shutdown
