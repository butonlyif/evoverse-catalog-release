# sw/diag_rxc.cfg —— RXC 翻转判据诊断（在 ftdi_ti.cfg + debug_load_ti.cfg 之后 -f）
# CPU 已被 debug_load_ti.cfg halt；读 CSR word 0x094（0xF8100250）两次，间隔 1s，
# 高半字 = dbg_pll_cnt（pll_rgmii_rx_clk 域），低半字 = dbg_rxc_cnt（rgmii_rxc 引脚域）
# 读完 resume 恢复固件运行，不打断回显循环
mem2array d1 32 0xF8100250 1
echo "RX_DBG#1 = 0x[format %08x $d1(0)]  (hi=pll_cnt lo=rxc_pin_cnt)"
sleep 1000
mem2array d2 32 0xF8100250 1
echo "RX_DBG#2 = 0x[format %08x $d2(0)]"
resume
