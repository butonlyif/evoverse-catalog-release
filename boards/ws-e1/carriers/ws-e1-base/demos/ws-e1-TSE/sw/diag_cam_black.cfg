# diag_cam_black.cfg — 黑屏诊断：只读采样 pacer/gen/dt 动态（G10 黑屏排查）
# 前置：ftdi_ti.cfg + debug_load_ti.cfg；板子须已在相机流模式（发包中）
# 位域（rtl/cam_udp_pacer.v status_o）：
#   [31:14]=quad_idx[17:0] [13:12]=2'h0 [11]=frame_active [10]=done [9:0]=occ
# 判读：
#   occ 正常 pacing 应在 199-489 摆动；恒 1023/恒 0/恒 ≥512 不动 = 指针错位
#   qidx 走 = gen 在消费（valid=1）；dt 走 = 相机流在进

proc rd {a} { mem2array _v 32 $a 1; return $_v(0) }

for {set i 0} {$i < 8} {incr i} {
    set pacer [rd 0xF810002C0]
    set dbg   [rd 0xF81000248]
    set dt    [rd 0xF81000270]
    set qidx  [expr {$pacer >> 14}]
    set occ   [expr {$pacer & 0x3FF}]
    set act   [expr {($pacer >> 11) & 1}]
    set done  [expr {($pacer >> 10) & 1}]
    set gst   [expr {($dbg >> 3) & 7}]
    echo "t$i: qidx=$qidx occ=$occ active=$act done=$done gen_state=$gst dt=0x[format %08X $dt]"
    sleep 300
}
shutdown
