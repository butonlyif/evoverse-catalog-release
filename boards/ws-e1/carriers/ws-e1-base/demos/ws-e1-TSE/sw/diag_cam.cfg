# sw/diag_cam.cfg —— P1/G8 相机链路探针（在 debug_load_ti.cfg 之后 -f 传入）
# 前提：debug_load_ti.cfg 已完成 target 创建 + init + soft_reset_halt + halt
# APB 基址 0xF8100000；相机探针 CSR（reg_apb3 'h09C-'h0A8，2026-11-06 迁移到
# paddr[3]=0 地址 —— G7 教训：debug 读通道 paddr[3] 断，0x258/0x25C 会别名）：
#   0xF8100270 cam_dt_cnt      RAW10 有效拍计数（200M 域，判据：步进大）
#   0xF8100280 {LINESTATE,ESC} 错误计数（判据：=0）
#   0xF8100290 {SOTSYNC,SOT}   错误计数（判据：=0）
#   0xF81002A0 cam_status      bit0=en bit1=busy bit2=done bit3=fail bit4=active
#                              bit5=stopclk [13:6]=idx [15:14]=round [19:16]=retry
#                              bit20=pll_0_locked [31:24]=locked上升沿计数
# 用法（cwd = embedded_sw\sapphire）：
#   openocd -f sw/bsp/openocd/ftdi_ti.cfg -f sw/bsp/openocd/debug_load_ti.cfg ^
#           -c "set elf_file <绝对路径>/tseDemo.elf" -f sw/diag_cam.cfg

if { ![info exists elf_file] } {
    echo "Error: elf_file not set."
    shutdown
}

echo "Loading firmware: $elf_file"
load_image $elf_file

# T0 快照（CPU halt 态读 APB，硬件计数器不受影响）
mem2array st1 32 0xF81002A0 1
mem2array dt1 32 0xF8100270 1
mem2array le1 32 0xF8100280 1
mem2array ss1 32 0xF8100290 1
sleep 1000
# T1 快照（1s 后）
mem2array st2 32 0xF81002A0 1
mem2array dt2 32 0xF8100270 1
mem2array le2 32 0xF8100280 1
mem2array ss2 32 0xF8100290 1

echo "T0: status=0x[format %08x $st1(0)] dt=0x[format %08x $dt1(0)] ls_esc=0x[format %08x $le1(0)] sotsync_sot=0x[format %08x $ss1(0)]"
echo "T1: status=0x[format %08x $st2(0)] dt=0x[format %08x $dt2(0)] ls_esc=0x[format %08x $le2(0)] sotsync_sot=0x[format %08x $ss2(0)]"
echo "DT_DELTA_PER_S=[expr {$dt2(0) - $dt1(0)}]"

resume 0xF9000000
echo "Firmware started."
