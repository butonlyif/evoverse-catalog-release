# diag_camdiag.cfg — cam 模式现场诊断（halt → 读 → resume 恢复固件）
proc rd {a} { mem2array _v 32 $a 1; return $_v(0) }
proc h {v} { return [format 0x%08X $v] }
halt 3000
echo "mode   0x208 = [h [rd 0xF81000208]]   (expect 0x44)"
echo "numipg 0x20C = [h [rd 0xF8100020C]]"
echo "gendbg 0x24C = [h [rd 0xF8100024C]]   (state=bit[5:3])"
echo "pacer  0x2C0 = [h [rd 0xF810002C0]]"
echo "dt     0x270 = [h [rd 0xF81000270]]"
echo "maccnt 0x240 = [h [rd 0xF81000240]]"
resume
shutdown
