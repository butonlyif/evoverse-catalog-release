# diag_probe.cfg — APB 存活判别：魔数 0x24C / PLL lock 0x254 / rxc-pll 计数双读
proc rd {a} { mem2array _v 32 $a 1; return $_v(0) }
proc h {v} { return [format 0x%08X $v] }
echo "magic   0x24C = [h [rd 0xF8100024C]]   (expect 0x037AE8D1)"
echo "plllk   0x254 = [h [rd 0xF81000254]]   (expect bit0=1)"
set a [rd 0xF81000250]
sleep 100
set b [rd 0xF81000250]
echo "rxc/pll 0x250 = [h $a] -> [h $b]      (应步进)"
set c [rd 0xF81000270]
sleep 100
set d [rd 0xF81000270]
echo "dt      0x270 = [h $c] -> [h $d]"
echo "mode    0x208 = [h [rd 0xF81000208]]"
shutdown
