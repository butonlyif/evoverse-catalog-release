# sw/diag_mux.cfg —— 读 pattern 控制寄存器状态
# 0xF8100204 : bit1=pat_mux_select bit0=axi4_st_mux_select
# 0xF8100208 : bit2=raw10_mode bit1=mac_pat_gen_en bit0=udp_pat_gen_en
mem2array m4 32 0xF8100204 1
mem2array m8 32 0xF8100208 1
echo "MUX_REG(0x204)=0x[format %08x $m4(0)]  PATEN_REG(0x208)=0x[format %08x $m8(0)]"
resume
