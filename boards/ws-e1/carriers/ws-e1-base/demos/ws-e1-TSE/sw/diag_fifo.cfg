# sw/diag_fifo.cfg —— MAC TX 静默丢包嫌疑计数器（16 位，间隔 2s）
# 0xC4 aTxFifoOverflowFramesErrors（Store-Forward TX FIFO 溢出丢弃）
# 0xC8 aTxIncontinuityFramesErrors（数据连续性错误）
# 0x8C ifOutErrors（TX 侧坏帧终止）
# 判据：2s 增量 ≈ +60（30/s）= 每帧末包被该机制吞掉
mem2array o1 16 0xF81000C4 1
mem2array c1 16 0xF81000C8 1
mem2array e1 16 0xF810008C 1
sleep 2000
mem2array o2 16 0xF81000C4 1
mem2array c2 16 0xF81000C8 1
mem2array e2 16 0xF810008C 1
echo "OVF=$o1(0)->$o2(0)  CONT=$c1(0)->$c2(0)  IFOUT=$e1(0)->$e2(0)"
resume
