# sw/diag_pat92.cfg —— 'h92 借道探针连读 5 次（axi addr 0x248）
# 'h092 = {5'h0, pat_dbg_i[8:0], eth_tx_full, eth_tx_free_cnt[12:0]}
# pat_dbg_i[8:0] = {raw10_r, pat_en, inf, state[2:0], frame_tick, en_d1, tvalid}
# 新 bit 生效判据：pat_en=1 / state≠0 / tvalid 翻转；全零 = 板上无借道逻辑（旧 bit）
mem2array d0 32 0xF8100248 1
mem2array p1 32 0xF8100248 1
mem2array p2 32 0xF8100248 1
mem2array p3 32 0xF8100248 1
mem2array p4 32 0xF8100248 1
mem2array p5 32 0xF8100248 1
echo "D0=0x[format %08x $d0(0)] P1=0x[format %08x $p1(0)] P2=0x[format %08x $p2(0)] P3=0x[format %08x $p3(0)] P4=0x[format %08x $p4(0)] P5=0x[format %08x $p5(0)]"
resume
