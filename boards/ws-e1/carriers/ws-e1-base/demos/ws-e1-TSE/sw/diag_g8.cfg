# diag_g8.cfg — cam_status 修复后首读（2026-11-06）
# 前置：ftdi_ti.cfg + debug_load_ti.cfg（soft reset + halt）
# 用法：openocd -f ftdi_ti.cfg -f debug_load_ti.cfg -f diag_g8.cfg -c shutdown

proc rd {a} { mem2array _v 32 $a 1; return $_v(0) }
proc h {v} { return [format 0x%08X $v] }

# 加载固件并运行
load_image D:/Projs/ws-e1-TSE/embedded_sw/sapphire/software/standalone/tseDemo/build/tseDemo.elf 0xF9000000 bin
resume 0xF9000000
sleep 3000

# 两轮读探针（间隔 1s，看 dt/status 步进）
foreach pass {1 2 3} {
    echo "=== PASS $pass ==="
    echo "cfg(0x208)   = [h [rd 0xF8100208]]  (bit0 udp_en bit2 raw10)"
    echo "dt(0x270)    = [h [rd 0xF8100270]]"
    echo "ls_esc(0x280)= [h [rd 0xF8100280]]"
    echo "sot(0x290)   = [h [rd 0xF8100290]]"
    echo "status(0x2A0)= [h [rd 0xF81002A0]]  (bit0 en bit1 busy bit2 done bit3 fail bit4 active bit5 stopclk [15:6] idx [17:16] round [19:16]... bit20 pll_locked [31:24] lock_edges)"
    sleep 1000
}
echo "=== DONE ==="
shutdown
