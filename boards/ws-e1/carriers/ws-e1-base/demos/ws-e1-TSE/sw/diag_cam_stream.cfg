# diag_cam_stream.cfg — G10 相机 RAW10 UDP 直推（板端开关）
# 前置：ftdi_ti.cfg + debug_load_ti.cfg（soft reset+halt）
# CSR：0x208 = {bit6 cam_src, bit3 kill, bit2 raw10, bit1 mac_en, bit0 udp_en}
#      0x20C = {ipg[31:16], num[15:0]}（num=0 无限帧）；0x2C0 = pacer 状态
# 流程：kill 旧引擎 → 0→1 使能（start_pulse 锁存 cam_r）→ pacer 按占用率发包
# PC 端：uv run doc/pc_tools/raw10_viewer.py（收 10.0.0.3:10005）

proc rd {a} { mem2array _v 32 $a 1; return $_v(0) }
proc h {v} { return [format 0x%08X $v] }

# 1) 停旧引擎（若在发图案）：en=0 + kill=1，当前包边界停车
mww 0xF81000208 0x00000008
sleep 200

# 2) 清 kill，随后 en 0→1（start_pulse 锁存 raw10+cam 模式）
mww 0xF81000208 0x00000040
sleep 50
mww 0xF81000208 0x00000045
sleep 300

# 3) 状态读回：0x208 模式 / 0x248 gen 探针 / 0x2C0 pacer / 0x270 dt
set st   [rd 0xF81000208]
set dbg  [rd 0xF81000248]
set pacer [rd 0xF810002C0]
set dt   [rd 0xF81000270]
echo "=== mode=0x[format %08X $st] gen_dbg=0x[format %08X $dbg] pacer=0x[format %08X $pacer] dt=0x[format %08X $dt] ==="
echo "=== pacer: qidx=[expr {$pacer >> 12}] active=[expr {($pacer >> 11) & 1}] done=[expr {($pacer >> 10) & 1}] occ=[expr {$pacer & 0x3FF}] ==="
shutdown
