# sw/diag_txok.cfg —— MAC aFramesTransmittedOK (0x068) 速率测量
# 读数 1 → sleep 2000ms → 读数 2；Δ/2 = MAC 实际发出的帧率
# 判据：≈53640/s（30×1788）= MAC 发全；≈53610/s（30×1787）= MAC 每帧丢末包
mem2array t1 32 0xF8100068 1
sleep 2000
mem2array t2 32 0xF8100068 1
mem2array t3 32 0xF8100068 1
echo "TXOK1=$t1(0) TXOK2=$t2(0) TXOK3=$t3(0)"
resume
