# sw/diag_cal.cfg —— debug 读/写通道写读回对拍标定（2026-11-06）
# 背景：0x24C 魔数读回 0x037ae8d1 而非 0x0C0DEBAXX，读数疑似别名。
#       G7 教训假设 H1：debug 通道 paddr[3] 恒 0（0x258→0x250 别名）。
#       若 H1 成立：0x24C 读应别名到 0x248（'h092 = {pat_dbg_i[8:0],tx_full,free_cnt}），
#       0x037ae8d1 可解码为 pat_dbg=0x1E2/free_cnt=0x8D1 —— 与 H1 自洽。
# 方法：向图案参数寄存器（当前未使能，写后恢复基线）写唯一指纹 → 读回对拍；
#       全 sweep 画别名映射。跳过 0x244（'h091 RX_DATA，读自动弹出 FIFO）。
# 前提：debug_load_ti.cfg 已完成 target 创建 + init + soft_reset_halt + halt
# 用法（cwd = embedded_sw\sapphire）：
#   openocd -f sw/bsp/openocd/ftdi_ti.cfg -f sw/bsp/openocd/debug_load_ti.cfg ^
#           -c "set elf_file <绝对路径>/tseDemo.elf" -f sw/diag_cal.cfg

if { ![info exists elf_file] } {
    echo "Error: elf_file not set."
    shutdown
}

proc rd {a} {
    mem2array _v 32 $a 1
    return $_v(0)
}
proc h {v} { return [format 0x%08x $v] }
proc off {a} { return [format 0x%03x [expr {$a - 0xF8100000}]] }

# sweep 集：字节地址 0x200..0x2A4，跳过 0x244
set sweep {}
foreach w {0x080 0x081 0x082 0x083 0x084 0x085 0x086 0x087 0x088 0x089 0x08a 0x08b 0x08c 0x090 0x092 0x093 0x094 0x095 0x09C 0x0A0 0x0A4 0x0A8 0x0A9} {
    lappend sweep [expr {0xF8100000 + ($w * 4)}]
}

echo "=== PHASE0 基线快照 ==="
array set base {}
foreach a $sweep {
    set base($a) [rd $a]
    echo "B [off $a] = [h $base($a)]"
}

echo "=== PHASE1 写指纹（图案参数寄存器）==="
mww 0xF810020C 0x00200190
mww 0xF8100210 0x11223344
mww 0xF8100214 0x00005566
mww 0xF8100218 0x778899AA
mww 0xF810021C 0x0000BBCC
mww 0xF8100220 0x000004D2
mww 0xF8100224 0xC0A80001
mww 0xF8100228 0xC0A80002
mww 0xF810022C 0x27103039
mww 0xF8100230 0x000005DC
echo "writes done"

echo "=== PHASE2 写读回对拍 ==="
array set exp {}
set exp(0xF810020C) 0x00200190
set exp(0xF8100210) 0x11223344
set exp(0xF8100214) 0x00005566
set exp(0xF8100218) 0x778899AA
set exp(0xF810021C) 0x0000BBCC
set exp(0xF8100220) 0x000004D2
set exp(0xF8100224) 0xC0A80001
set exp(0xF8100228) 0xC0A80002
set exp(0xF810022C) 0x27103039
set exp(0xF8100230) 0x000005DC
set npass 0
set nfail 0
foreach a {0xF810020C 0xF8100210 0xF8100214 0xF8100218 0xF810021C \
           0xF8100220 0xF8100224 0xF8100228 0xF810022C 0xF8100230} {
    set r [rd $a]
    if {$r == $exp($a)} { set ok PASS; incr npass } else { set ok FAIL; incr nfail }
    echo "W2R [off $a] exp=[h $exp($a)] got=[h $r] $ok"
}
echo "WRITE_READBACK: pass=$npass fail=$nfail"

echo "=== PHASE3 全 sweep 别名映射 ==="
foreach a $sweep {
    set r1 [rd $a]
    set r2 [rd $a]
    echo "S [off $a] = [h $r1] / [h $r2]  (base=[h $base($a)])"
}

echo "=== PHASE4 恢复基线 ==="
foreach a {0xF810020C 0xF8100210 0xF8100214 0xF8100218 0xF810021C \
           0xF8100220 0xF8100224 0xF8100228 0xF810022C 0xF8100230} {
    mww $a $base($a)
}
echo "restore done"

echo "=== PHASE5 相机探针 T0/T1 + 0x248/0x24C 复核 ==="
mem2array st1 32 0xF81002A0 1
mem2array dt1 32 0xF8100270 1
mem2array m48 32 0xF8100248 1
mem2array m4c 32 0xF810024C 1
sleep 1000
mem2array st2 32 0xF81002A0 1
mem2array dt2 32 0xF8100270 1
echo "T0: status=[h $st1(0)] dt=[h $dt1(0)]"
echo "T1: status=[h $st2(0)] dt=[h $dt2(0)]"
echo "DT_DELTA_PER_S=[expr {$dt2(0) - $dt1(0)}]"
echo "M48=[h $m48(0)] M48_2nd=[h [rd 0xF8100248]]"
echo "M4C=[h $m4c(0)] M4C_2nd=[h [rd 0xF810024C]]"

load_image $elf_file
resume 0xF9000000
echo "Firmware started."
