# diag_readcheck.cfg — 读通道验证：0x2C4 free200 应步进、0x2A0 应有值
proc rd {a} { mem2array _v 32 $a 1; return $_v(0) }
for {set i 0} {$i < 3} {incr i} {
    set c4a [rd 0xF810002C4]
    set c4b [rd 0xF810002C4]
    set a0  [rd 0xF810002A0]
    set ac  [rd 0xF810002AC]
    set m8  [rd 0xF81000208]
    echo "i$i: free200a=0x[format %08X $c4a] free200b=0x[format %08X $c4b] camst=0x[format %08X $a0] lane=0x[format %08X $ac] mode=0x[format %08X $m8]"
    sleep 200
}
shutdown
