# diag_g8b.cfg — 分步定位：halt 态读 → 加载固件 → resume → 运行态读
proc rd {a} { mem2array _v 32 $a 1; return $_v(0) }
proc h {v} { return [format 0x%08X $v] }

echo "=== HALTED READS ==="
echo "cfg(0x208)    = [h [rd 0xF8100208]]"
echo "status(0x2A0) = [h [rd 0xF81002A0]]"

echo "=== LOAD + RESUME ==="
load_image D:/Projs/ws-e1-TSE/embedded_sw/sapphire/software/standalone/tseDemo/build/tseDemo.elf 0xF9000000 bin
resume 0xF9000000
sleep 3000

echo "=== RUNNING READ 1 ==="
echo "cfg(0x208)    = [h [rd 0xF8100208]]"
echo "dt(0x270)     = [h [rd 0xF8100270]]"
echo "status(0x2A0) = [h [rd 0xF81002A0]]"
sleep 1000
echo "=== RUNNING READ 2 ==="
echo "dt(0x270)     = [h [rd 0xF8100270]]"
echo "status(0x2A0) = [h [rd 0xF81002A0]]"
echo "=== DONE ==="
shutdown
