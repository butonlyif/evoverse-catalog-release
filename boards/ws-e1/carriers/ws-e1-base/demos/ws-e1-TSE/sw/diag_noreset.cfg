# diag_noreset2.cfg — 自带 target 定义，纯 halt（无 soft reset）读 CSR 现场固件须在运行中）
set _ENDIAN little
if { [info exists CPUTAPID] } { set _CPUTAPID $CPUTAPID } else { set _CPUTAPID 0x00690A79 }
gdb_target_description disable
set instr_addr 0xF9000000
if { [info exists bsp_loc] } { set proj_loc $bsp_loc } else { set proj_loc . }
adapter speed 800
adapter srst delay 260
jtag_ntrst_delay 250
set _CHIPNAME fpga_spinal
jtag newtap $_CHIPNAME bridge -irlen 5 -ircapture 0x5 -irmask 0xF
target create $_CHIPNAME.cpu0 vexriscv -endian $_ENDIAN -chain-position $_CHIPNAME.bridge -coreid 0 -dbgbase 0x10B80000 -work-area-phys 0xF9000000 -work-area-size 1024
vexriscv readWaitCycles 40
vexriscv cpuConfigFile $proj_loc/cpu0.yaml
vexriscv jtagMapping 8 8 0 1 2 2
targets $_CHIPNAME.cpu0
poll_period 50
init
halt 3000

proc rd {a} { mem2array _v 32 $a 1; return $_v(0) }
proc h {v} { return [format 0x%08X $v] }
echo "mode   0x208 = [h [rd 0xF81000208]]"
echo "mux    0x204 = [h [rd 0xF81000204]]"
echo "numipg 0x20C = [h [rd 0xF8100020C]]"
echo "gendbg 0x24C = [h [rd 0xF8100024C]]"
echo "pacer  0x2C0 = [h [rd 0xF810002C0]]"
echo "dtcnt  0x270 = [h [rd 0xF81000270]]"
echo "maccnt 0x240 = [h [rd 0xF81000240]]"
resume
shutdown
