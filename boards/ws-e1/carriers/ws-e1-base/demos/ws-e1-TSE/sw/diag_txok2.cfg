# sw/diag_txok2.cfg —— aFramesTransmittedOK(0x68,16bit) 10s 模解析
# 10s 窗口 ~53.6 万帧，16 位计回绕 8 次：residue=(t2-t1) mod 65536
#   MAC=线上(1787/帧): residue ≈ 536100 mod 65536 = 8868±噪声
#   MAC 全发(1788/帧): residue ≈ 536400 mod 65536 = 9168±噪声
mem2array k1 16 0xF8100068 1
sleep 10000
mem2array k2 16 0xF8100068 1
echo "TXOK16 $k1(0) -> $k2(0) residue=[expr ($k2(0) - $k1(0)) % 65536]"
resume
