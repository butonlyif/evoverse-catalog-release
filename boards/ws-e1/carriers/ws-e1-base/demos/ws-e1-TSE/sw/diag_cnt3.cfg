# sw/diag_cnt3.cfg —— 单会话计数器差分（第一读在 soft_reset 清零后，第二读在 8s 窗口后）
mem2array tx1 32 0xF8100068 1
mem2array rx1 32 0xF810006C 1
echo "SNAP1 tx=[format %u $tx1(0)] rx=[format %u $rx1(0)]"
resume
sleep 8000
halt
mem2array tx2 32 0xF8100068 1
mem2array rx2 32 0xF810006C 1
echo "SNAP2 tx=[format %u $tx2(0)] rx=[format %u $rx2(0)]"
resume
