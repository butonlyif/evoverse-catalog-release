# sw/openocd_pre.cfg —— OpenOCD 固件加载脚本（在 debug_load_ti.cfg 之后 -f 传入）
# 前提：debug_load_ti.cfg 已完成 target 创建 + init + soft_reset_halt + halt
# 用法（cwd = embedded_sw\sapphire，cpu0.yaml 所在目录）：
#   openocd -f sw/bsp/openocd/ftdi_ti.cfg -f sw/bsp/openocd/debug_load_ti.cfg ^
#           -c "set elf_file <绝对路径>/tseDemo.elf" -f sw/openocd_pre.cfg
# ELF 链接基址 0xF9000000（bsp linker default.ld，32K RAM），load_image 按 ELF 段自动放置

if { [info exists elf_file] } {
    echo "Loading firmware: $elf_file"
    load_image  $elf_file
    # 注：vexriscv 目标不支持 verify_image（checksum_memory），下载校验由 GDB 流程承担
    # 入口 = _start（ELF ENTRY），恢复运行
    resume 0xF9000000
    echo "Firmware started."
} else {
    echo "Error: elf_file not set. Add: -c \"set elf_file <path>\" before -f sw/openocd_pre.cfg"
}
