# sw/diag_txtx.cfg —— netsvc sw-TX 死路探针（ftdi_ti + debug_load_ti 之后 -f）
# halt → 读 TX_STATUS(0xF8100248)/mux(0xF8100204)/cfg208(0xF8100208)/tx_ok(0xF8100068)
# 判据：TXSTAT free 持续收缩=帧写进 FIFO 但 MAC 不消费；MUX 应为 0x10(sw)
mem2array t1 32 0xF8100248 1
mem2array m1 32 0xF8100204 1
mem2array p1 32 0xF8100208 1
mem2array k1 32 0xF8100068 1
sleep 1000
mem2array t2 32 0xF8100248 1
mem2array k2 32 0xF8100068 1
echo "TXSTAT=$t1 -> $t2   MUX=$m1  CFG208=$p1  TXOK=$k1 -> $k2"
resume
