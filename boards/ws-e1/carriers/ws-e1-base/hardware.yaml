interfaces:
  - id: fmc_hpc_j3
    source_refs: [ws-e1-base-schematic-pdf, ws-e1-core-schematic-pdf]
    validation_state: CONFIRMED
    notes: >-
      J3 = ASP-134486-01 x2, 400-pin FMC HPC (base p4); LPC-vs-HPC doc
      discrepancy resolved: connector P/N confirms HPC. 135 FPGA nets routed
      P4<->P10 B2B to J3 extracted from base p4 red labels and matched to
      core balls on core p13 (2B/2C/3B, SPI) / p14 (3C) / p15 (4A/4B);
      every ball cross-checked against devices/TJ180A484S.pinout.csv.
      FMC rows appended in pinout/ws-e1-fpga-v1.csv (endpoint fmc_hpc_j3).
  - id: mipi_rx_p5
    source_refs: [ws-e1-base-schematic]
    validation_state: CONFIRMED
    notes: >-
      P5 = QSE-020-01-F-D-A, MIPI_RX to sensor (base p7); left odd column
      MIPI0_RX lanes 0-4, right even column MIPI2_RX lanes 0-4; pins matched
      by row y-coordinate with inner pin-name labels as cross-check.
  - id: mipi_tx_p6
    source_refs: [ws-e1-base-schematic]
    validation_state: CONFIRMED
    notes: >-
      P6 = QSE-020-01-F-D-A, MIPI_TX to HDMI (base p7); left odd column
      MIPI0_TX lanes 0-4, right even column MIPI2_TX lanes 0-4; pins matched
      by row y-coordinate with inner pin-name labels as cross-check.
