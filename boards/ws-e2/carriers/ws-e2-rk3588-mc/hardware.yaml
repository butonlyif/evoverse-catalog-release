device_behaviors:
  - id: btn-rk-maskrom
    device_type: push_button
    active_level: low
    derivation: Carrier sheet 3 states RK_BOOT_SARADC_IN0=0V after power-on reset enters Maskrom mode and that SARADC_IN0 is internally pulled up to 1.8 V; the tact switch shorts the net to GND.
    source_refs: [ws-e2-mc-carrier-schematic]
    validation_state: CONFIRMED
  - id: led-rk-user0
    device_type: led
    active_level: UNVERIFIED
    derivation: GREEN LED D1 with 22R series resistor on net RK_USER_LED0 (carrier sheet 3); LED anode/cathode orientation not recoverable from extracted text.
    source_refs: [ws-e2-mc-carrier-schematic]
    validation_state: UNVERIFIED
  - id: led-rk-user1
    device_type: led
    active_level: UNVERIFIED
    derivation: GREEN LED D2 with 22R series resistor on net RK_USER_LED1 (carrier sheet 3); orientation not recoverable from extracted text.
    source_refs: [ws-e2-mc-carrier-schematic]
    validation_state: UNVERIFIED
  - id: led-f-user0
    device_type: led
    active_level: UNVERIFIED
    derivation: GREEN LED D79 with 22R series resistor on net F_USER_LED0 (carrier sheet 12); orientation not recoverable from extracted text.
    source_refs: [ws-e2-mc-carrier-schematic]
    validation_state: UNVERIFIED
  - id: led-f-user1
    device_type: led
    active_level: UNVERIFIED
    derivation: GREEN LED D81 with 22R series resistor on net F_USER_LED1 (carrier sheet 12); orientation not recoverable from extracted text.
    source_refs: [ws-e2-mc-carrier-schematic]
    validation_state: UNVERIFIED
  - id: dip-rk-user-sw0-3
    device_type: dip_switch
    active_level: UNVERIFIED
    derivation: DSIC04LSGET 4-bit DIP drives RK_USER_SW0-3 through carrier level shifters (sheets 3, 21); per-bit active level not derivable from extracted text.
    source_refs: [ws-e2-mc-carrier-schematic]
    validation_state: UNVERIFIED
  - id: dip-f-user-sw0-1
    device_type: dip_switch
    active_level: UNVERIFIED
    derivation: DSIC02LSGET 2-bit DIP drives F_USER_SW0/1 (carrier sheet 12); active level not derivable from extracted text.
    source_refs: [ws-e2-mc-carrier-schematic]
    validation_state: UNVERIFIED
  - id: fan-j1
    device_type: fan
    active_level: UNVERIFIED
    derivation: 3-pin fan connector J1 2510-3A driven by RK_PWM11_IR_M2_1V8 through MMBT3904 low-side stages (carrier sheet 3); PWM polarity not derivable from extracted text.
    source_refs: [ws-e2-mc-carrier-schematic]
    validation_state: CONFIRMED
    notes: Fan presence and PWM control path confirmed; PWM active level unverified
