    date: '2026-11-11'
    host: WSL Ubuntu-24.04, gcc-aarch64-linux-gnu 13.3.0
    scope: compile-level smoke only; no flash, no boot, no hardware validation
    kernel:
      result: PASS
      config: rockchip_linux_defconfig + rk3588.config fragment merge (also built inside buildroot via LINUX_OVERRIDE_SRCDIR)
      artifacts: Image 41925120 bytes (release 6.1.172) + 77 rk3588 dtbs incl. rk3588-evb1-lp4-v10-linux.dtb
      notes: merge_config.sh must run from inside the O= dir (invoking it from the source tree writes .config into the source tree and trips the outputmakefile clean check)
    u-boot:
      result: PASS
      config: rk3588_defconfig
      artifacts: idbloader.img 343069 bytes (sha256 e17d4bfd88c14cd8582258776f5174f5cccc37437bf01db47ad665a89d0e4b17, in-tree TPL+SPL rksd) + u-boot.itb 2180096 bytes (sha256 3eaa94366716b468870d569e4228689545b10579da4845694537e2e759cdcb3d, FIT with BL31 v1.56 + BL32 v1.23); shas vary per build (embedded build timestamp)
      notes: vendor tree -Werror vs gcc 13.3 needs KCFLAGS="-Wno-error" (edid.c maybe-uninitialized, command.c enum-int-mismatch); make_fit_atf.sh hardcodes ./bl31.elf and tee.bin copies in-tree; idbloader.img has no make rule (SDK packaging layer) - manual mkimage -T rksd of tpl+spl works; dtc required on host
    buildroot:
      result: PASS
      config: board-ws-e2 BR2_EXTERNAL, ws-e2_rk3588j_defconfig (kernel from the pinned tree via LINUX_OVERRIDE_SRCDIR; headers series 6.1 explicit - AS_KERNEL+CUSTOM_VERSION is a broken buildroot combo producing a bogus "expected 2.6" strict check)
      artifacts: full flashable set at WSL /root/ws-e2-bsp/.smoke-br-out/images/ws-e2-image/ - boot.img 42436608 bytes (sha256 24074cc1a9a26237ef82622d800b1a834f3ae867e0772c573d3af0613dd5b8b2, Android bootimg header v2, EVB dtb placeholder) + rootfs.ext4 536870912 bytes (sha256 7b5c44c45ddd94f4a8fc6d077f7bcfe00524e2baf4bca953128035f236dedafe) + idbloader/u-boot.itb/parameter.txt; mkbootimg vendored (Apache-2.0, apt mkbootimg broken - missing gki module)
      notes: DTS placeholder is rk3588-evb1-lp4-v10-linux until the schematic-derived ws-e2 DTS lands; boot cmdline root device must be confirmed at board bring-up; AVB (CONFIG_ANDROID_AVB) acceptance of unsigned boot.img is a bring-up item
